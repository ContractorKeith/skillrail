[package]
name = "skillrail"
version = "0.1.0-dev"
edition = "2024"
license = "MIT"
description = "Local-first skill and MCP registry"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
rusqlite = { version = "0.38", features = ["bundled"] }
ratatui = "0.30"
crossterm = "0.29"
serde-saphyr = "2.0.0"
sha2 = "0.11.1"
toml = "1.1.8"
semver = "1.0"
tempfile = "3"

rmcp = { version = "3.8.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
libc = "0.2"
toml_edit = "0.25"

[dev-dependencies]
rmcp = { version = "3.8.0", default-features = false, features = ["client", "transport-child-process"] }
