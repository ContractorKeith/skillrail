[package]
name = "skillrail"
version = "0.1.0-dev"
edition = "2024"
license = "MIT"
description = "Local-first skill and MCP registry"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
ratatui = "0.30"
crossterm = "0.29"

[dev-dependencies]
tempfile = "3"
