name: Candidate archives
# No tag trigger, write permission or publication step. Parent owns release.
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    name: package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13.9'
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: rustup override set 1.98.1
      - run: bash scripts/accept.sh
      - run: python3 scripts/release.py build --target ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skillrail-${{ matrix.target }}
          path: target/dist/*
          if-no-files-found: error
          retention-days: 14
